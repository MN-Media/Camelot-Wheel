[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type  = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    # Einbetten nur auf der eigenen Website erlauben (Key-Navigator-Seite auf mnmedia.app)
    Content-Security-Policy = "frame-ancestors 'self' https://mnmedia.app https://www.mnmedia.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Umbenennung (30.10.2026): alte Adresse camelot-wheel.mnmedia.app leitet dauerhaft auf key-navigator.mnmedia.app
# (greift nur, wenn die Anfrage über die alte Adresse kommt; beide Domains hängen am selben Netlify-Projekt)
[[redirects]]
  from = "https://camelot-wheel.mnmedia.app/*"
  to = "https://key-navigator.mnmedia.app/:splat"
  status = 301
  force = true
